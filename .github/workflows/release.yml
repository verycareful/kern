name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Produces jniLibs/<abi>/libkern_pdf.so so the released APK ships the PDF engine.
      - name: Build PDF native bridge
        uses: ./.github/actions/build-pdf-bridge

      # Kern has no release signingConfig yet, and an unsigned assembleRelease APK
      # cannot be installed, so a debug build is still what gets published. Say so
      # loudly instead of letting it pass silently. Do NOT fail the job: that would
      # block releases outright. See issue #16 for the signing work that removes this.
      - name: Warn that this release publishes a debug build
        run: |
          echo "::warning title=Publishing a debug build::${GITHUB_REF_NAME} ships a debug-signed, debuggable APK. Switching to a signed assembleRelease build needs a keystore in repo secrets - see issue #16."
          {
            echo "## Warning: this release publishes a debug build"
            echo
            echo "\`kern-${GITHUB_REF_NAME}-debug.apk\` comes from \`assembleDebug\`:"
            echo
            echo "- signed with Android's auto-generated debug keystore, not a stable release key"
            echo "- \`debuggable=true\`"
            echo "- not minified or resource-shrunk (the \`release\` build type is validated by the Release build check workflow, but cannot be published unsigned)"
            echo
            echo "Publishing a signed \`assembleRelease\` build requires a keystore plus passwords in repository secrets and a \`signingConfig\` in \`build.gradle.kts\`. Tracked in issue #16."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK named for the tag
        run: |
          mkdir -p dist
          cp build/outputs/apk/debug/*.apk "dist/kern-${GITHUB_REF_NAME}-debug.apk"

      # The release notes are the tag's own section of CHANGELOG.md and nothing
      # else. A tag with no section stops here instead of publishing empty notes.
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > dist/release-notes.md
          if [ ! -s dist/release-notes.md ]; then
            echo "::error title=No changelog entry::CHANGELOG.md has no '## [${version}]' section."
            exit 1
          fi
          cat dist/release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kern ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: dist/release-notes.md
          files: dist/kern-${{ github.ref_name }}-debug.apk
