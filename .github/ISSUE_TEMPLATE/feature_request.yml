name: Feature request
description: Something Kern should do that it does not.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start from the problem, not the solution. "PDF: dark mode" cannot be acted on; "PDF: reading at night, white pages are too bright" can.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - PDF
        - Word
        - Excel
        - PowerPoint
        - CSV
        - EPUB
        - Markdown
        - Plain text
        - File browser and opening files
        - Settings
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where Kern stopped you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: Optional. How you picture it working.
  - type: input
    id: version
    attributes:
      label: Kern version
      description: Settings > About > Version.
      placeholder: 0.1.14.1
